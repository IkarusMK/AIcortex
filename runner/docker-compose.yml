services:
  aicortex-runner:
    build: .
    pull_policy: build
    container_name: aicortex-runner
    restart: unless-stopped
    environment:
      HOME: /config
      # ── Connector ───────────────────────────────────────────────────
      # A runner key (WebUI → Scheduled jobs → Set up the runner) or the
      # connector's RUNNER_TOKEN. With it the runner asks for due jobs itself
      # and starts Claude only when one is due. Leave both empty for the older
      # setup with a one-time connector login inside the container.
      CONNECTOR_URL: "${CONNECTOR_URL:-}"
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
      # ── Model auth (pick one) ───────────────────────────────────────
      # Claude subscription: the token from `claude setup-token` (run it on any
      # machine where you are signed in).
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      # Or a pay-per-use Anthropic API key.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Seconds between checks, aligned to the clock.
      RUNNER_INTERVAL: "${RUNNER_INTERVAL:-60}"
      # Swap the LLM backend here (must accept a prompt arg + have the connector
      # tools available). Default = Claude Code headless.
      RUNNER_CMD: "${RUNNER_CMD:-claude -p --output-format text}"
    volumes:
      - ./config:/config          # persists connector OAuth + MCP config + API key
      - ./logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
