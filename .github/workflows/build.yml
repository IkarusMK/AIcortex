name: build-and-push

# Builds the container image and pushes it to GitHub Container Registry (GHCR)
# for each release: a version tag (vX.Y.Z) builds once and is tagged both vX.Y.Z
# and latest, so `latest` is always a release — commits between releases build no
# image (the tests workflow still checks every push). The image name is derived
# from the repo and lowercased automatically → ghcr.io/<owner>/aicortex.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# buildx writes provenance into the "Metadata" block build-push-action prints to
# the log — even with the image attestation off below — and the build record and
# summary carry the build too. In a public repository that is the complete GitHub
# event, including the pusher's email address.
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"
  BUILDX_METADATA_PROVENANCE: "disabled"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Blocking supply-chain gate (same rule as tests.yml): a known advisory stops the
      # release unless it is assessed and listed in .github/pip-audit-ignore.txt.
      - name: Dependency audit (blocking)
        run: |
          python -m pip install --quiet pip-audit
          ignores=$( { grep -vE '^\s*(#|$)' .github/pip-audit-ignore.txt || true; } | awk '{print "--ignore-vuln " $1}' | tr '\n' ' ')
          pip-audit -r app/requirements.txt ${ignores}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Scan the image before anything is pushed: build amd64 into the local Docker
      # engine, then let Trivy fail the release on CRITICAL/HIGH findings that have a
      # fix (OS packages and Python libraries). Unfixed ones can't be acted on and
      # are left to Dependabot / the next base-image update.
      - name: Build for scanning (amd64, local only)
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: aicortex:scan
          cache-from: type=gha

      - name: Scan image (Trivy, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aicortex:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # No BuildKit provenance: in a public repository the action defaults to
          # mode=max, which embeds the complete GitHub event — for a push, the
          # pusher's email address — in the image's attestation.
          provenance: false
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Lists the release in the official MCP Registry (registry.modelcontextprotocol.io)
  # once its image is pushed. GitHub's OIDC token proves the io.github.IkarusMK
  # namespace, so no stored secret is needed. server.json must name this tag.
  publish-registry:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: server.json names this release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          test "$(jq -r .version server.json)" = "${tag#v}"
          test "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/ikarusmk/aicortex:${tag}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
