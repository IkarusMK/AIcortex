name: tests

# Real green/red signal on every PR and every push to main: installs the pinned
# deps on the SAME Python as the runtime image, byte-compiles the app, and runs the
# pytest suite (with coverage) under tests/. This is what makes dependency bumps
# (incl. Dependabot's) verifiable before they land — build.yml only builds/pushes
# the image.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python (matches the runtime base image)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Byte-compile the app
        run: python -m compileall -q app

      - name: Run tests (pytest + coverage)
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing

      # Blocking supply-chain gate: a known advisory in a dependency fails the run.
      # An advisory that has no fix and has been assessed goes into
      # .github/pip-audit-ignore.txt (one ID per line, with the reason as a comment).
      - name: Dependency audit (blocking)
        run: |
          python -m pip install --quiet pip-audit
          ignores=$( { grep -vE '^\s*(#|$)' .github/pip-audit-ignore.txt || true; } | awk '{print "--ignore-vuln " $1}' | tr '\n' ' ')
          pip-audit -r app/requirements.txt ${ignores}

      # Dockerfile lint; fails on errors, reports warnings.
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
