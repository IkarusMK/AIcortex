<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIcortex — Admin</title>
  <link rel="icon" href="/ui/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/assets/style.css?v={{v}}">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <!-- ── Login ─────────────────────────────────────────────────────────── -->
  <section id="view-login" class="login hidden">
    <div class="login-card panel">
      <div class="brand-row center">
        <img class="logo lg" src="/ui/assets/logo.svg" alt="">
        <span class="brand">AI<em>cortex</em></span>
      </div>
      <p class="tagline" data-i18n="tagline">A SELF-HOSTED MCP BRAIN FOR ANY LLM</p>
      <div class="term-chip"><span class="term-icon">&gt;_</span>
        <span class="term-text">Your brain. Your hardware. <b>Any LLM</b></span>
        <span class="cursor" aria-hidden="true"></span>
      </div>
      <button id="btn-login" class="btn primary big" data-i18n="login_btn">Anmelden mit SSO</button>
      <p id="login-error" class="err hidden"></p>
      <p class="dim small" data-i18n="login_hint"></p>
    </div>
  </section>

  <!-- ── Kein Admin ────────────────────────────────────────────────────── -->
  <section id="view-denied" class="login hidden">
    <div class="login-card panel">
      <div class="brand-row center">
        <img class="logo lg" src="/ui/assets/logo.svg" alt="">
        <span class="brand">AI<em>cortex</em></span>
      </div>
      <h2 data-i18n="denied_title"></h2>
      <p class="dim" data-i18n="denied_text"></p>
      <button id="btn-logout-denied" class="btn ghost" data-i18n="logout"></button>
    </div>
  </section>

  <!-- ── App ───────────────────────────────────────────────────────────── -->
  <div id="app" class="app hidden">
    <aside class="rail">
      <div class="brand-row">
        <img class="logo" src="/ui/assets/logo.svg" alt="">
        <span class="brand">AI<em>cortex</em></span>
      </div>
      <nav class="nav">
        <a href="#overview" data-nav="overview" data-admin><span class="ico">◳</span><span data-i18n="nav_overview"></span></a>
        <a href="#memory"   data-nav="memory"><span class="ico">✎</span><span data-i18n="nav_memory"></span></a>
        <a href="#cron"     data-nav="cron"><span class="ico">⏱</span><span data-i18n="nav_cron"></span></a>
        <a href="#playbooks" data-nav="playbooks"><span class="ico">☰</span><span data-i18n="nav_playbooks"></span></a>
        <a href="#vault"    data-nav="vault" data-admin><span class="ico">🗝</span><span data-i18n="nav_vault"></span></a>
        <a href="#clients"  data-nav="clients" data-admin><span class="ico">⚡</span><span data-i18n="nav_clients"></span></a>
        <a href="#skills"   data-nav="skills" data-admin><span class="ico">⌘</span><span data-i18n="nav_skills"></span></a>
        <a href="#services" data-nav="services" data-admin><span class="ico">⇄</span><span data-i18n="nav_services"></span></a>
        <a href="#users"    data-nav="users" data-admin><span class="ico">◉</span><span data-i18n="nav_users"></span></a>
        <a href="#logs"     data-nav="logs" data-admin><span class="ico">≣</span><span data-i18n="nav_logs"></span></a>
      </nav>
      <div class="rail-foot">
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="lang-de" data-setlang="de">DE</button><button id="lang-en" data-setlang="en">EN</button>
        </div>
        <div class="user-chip">
          <span class="dot"></span>
          <span id="user-name" class="ellip"></span>
          <button id="btn-logout" class="linkish" data-i18n="logout"></button>
        </div>
        <div class="version mono" id="ui-version"></div>
      </div>
    </aside>

    <main class="main">
      <!-- Overview -->
      <section id="view-overview" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_overview"></h1>
          <span id="ov-enforce" class="badge"></span>
        </header>
        <div class="stat-grid" id="ov-grid"></div>
        <div class="term-chip wide"><span class="term-icon">&gt;_</span>
          <span class="term-text" data-i18n="ov_footer"></span><span class="cursor" aria-hidden="true"></span>
        </div>
      </section>

      <!-- Vault -->
      <section id="view-vault" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_vault"></h1>
          <span class="badge cyan" data-i18n="vault_badge"></span>
        </header>
        <div class="term-chip wide" id="vault-state">
          <span class="term-icon">🗝</span>
          <span class="term-text" id="vault-state-text"></span>
          <span class="spacer"></span>
          <button id="btn-vault-rekey" class="btn ghost sm hidden" data-i18n="vault_rekey"></button>
        </div>
        <p id="vault-missing" class="err small hidden"></p>
        <div class="grid-2">
          <div class="panel">
            <h3 data-i18n="vault_list_title"></h3>
            <p class="dim small" data-i18n="vault_list_hint"></p>
            <table class="tbl" id="vault-table">
              <thead><tr>
                <th data-i18n="vault_col_name"></th>
                <th data-i18n="vault_col_owner"></th>
                <th data-i18n="vault_col_used"></th>
                <th data-i18n="vault_col_updated"></th><th></th>
              </tr></thead>
              <tbody></tbody>
            </table>
            <p id="vault-empty" class="dim hidden" data-i18n="vault_empty"></p>
          </div>
          <div class="panel accent">
            <h3 data-i18n="vault_add_title"></h3>
            <form id="form-secret" autocomplete="off">
              <label data-i18n="vault_f_name"></label>
              <input id="sec-name" class="inp mono" required
                     pattern="[^/]+" data-i18n-ph="vault_ph_name">
              <label data-i18n="vault_f_value"></label>
              <div class="pw-row">
                <input id="sec-value" class="inp mono" type="password" required
                       data-i18n-ph="vault_ph_value">
                <button type="button" id="sec-toggle" class="btn ghost sm">👁</button>
              </div>
              <label data-i18n="vault_f_desc"></label>
              <input id="sec-desc" class="inp" maxlength="300" data-i18n-ph="vault_ph_desc">
              <label data-i18n="vault_f_owner"></label>
              <input id="sec-owner" class="inp mono" list="sec-owner-list" data-i18n-ph="vault_ph_owner">
              <datalist id="sec-owner-list"></datalist>
              <p class="dim small" data-i18n="vault_writeonly"></p>
              <button class="btn primary" data-i18n="vault_save"></button>
            </form>
          </div>
        </div>
      </section>

      <!-- Connect clients (agent keys) -->
      <section id="view-clients" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_clients"></h1>
          <span class="badge cyan mono" id="cl-url"></span>
        </header>
        <div class="grid-2">
          <div class="panel">
            <h3 data-i18n="cl_list_title"></h3>
            <p class="dim small" data-i18n="cl_list_hint"></p>
            <table class="tbl" id="cl-table">
              <thead><tr>
                <th data-i18n="cl_col_agent"></th><th data-i18n="cl_col_person"></th>
                <th data-i18n="cl_col_access"></th><th data-i18n="cl_col_created"></th><th></th>
              </tr></thead>
              <tbody></tbody>
            </table>
            <p id="cl-empty" class="dim hidden" data-i18n="cl_empty"></p>
          </div>
          <div class="panel accent">
            <h3 data-i18n="cl_new_title"></h3>
            <form id="form-agentkey" autocomplete="off">
              <label data-i18n="cl_f_name"></label>
              <input id="ak-name" class="inp mono" required data-i18n-ph="cl_ph_name">
              <label data-i18n="cl_f_person"></label>
              <input id="ak-person" class="inp mono" required list="ak-person-list" data-i18n-ph="cl_ph_person">
              <datalist id="ak-person-list"></datalist>
              <label data-i18n="cl_f_profile"></label>
              <select id="ak-profile" class="inp">
                <option value="core" data-i18n="cl_profile_core"></option>
                <option value="full" data-i18n="cl_profile_full"></option>
              </select>
              <label data-i18n="cl_f_scopes"></label>
              <input id="ak-scopes" class="inp mono" value="all">
              <label data-i18n="cl_f_ttl"></label>
              <input id="ak-ttl" class="inp mono" type="number" min="0" value="0">
              <button class="btn primary" data-i18n="cl_create"></button>
            </form>
            <div id="cl-result" class="hidden">
              <p class="err small" data-i18n="cl_once"></p>
              <div class="pw-row">
                <input id="cl-key" class="inp mono" readonly>
                <button type="button" id="cl-copy-key" class="btn ghost sm" data-i18n="cl_copy"></button>
              </div>
              <label data-i18n="cl_f_client"></label>
              <select id="cl-client" class="inp"></select>
              <pre id="cl-snippet" class="inp mono small"></pre>
              <button type="button" id="cl-copy-snippet" class="btn ghost sm" data-i18n="cl_copy"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Skills -->
      <section id="view-skills" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_skills"></h1>
          <button id="btn-skill-examples" class="btn ghost sm" data-i18n="sk_examples"></button>
          <button id="btn-skill-new" class="btn primary sm" data-i18n="sk_new"></button>
        </header>
        <div class="chips" id="sk-cats"></div>
        <div class="grid-2 skills-layout">
          <div class="panel scroll" id="sk-list"></div>
          <div class="panel accent hidden" id="sk-editor">
            <h3 id="sk-editor-title"></h3>
            <form id="form-skill" autocomplete="off">
              <label data-i18n="sk_f_name"></label>
              <input id="sk-name" class="inp" required>
              <div class="row-2">
                <div>
                  <label data-i18n="sk_f_category"></label>
                  <input id="sk-category" class="inp" list="sk-cat-list" required>
                  <datalist id="sk-cat-list"></datalist>
                </div>
                <div>
                  <label data-i18n="sk_f_tags"></label>
                  <input id="sk-tags" class="inp">
                </div>
              </div>
              <label data-i18n="sk_f_desc"></label>
              <input id="sk-desc" class="inp" required>
              <label data-i18n="sk_f_body"></label>
              <textarea id="sk-body" class="inp mono" rows="14" spellcheck="false"></textarea>
              <div class="btn-row">
                <button class="btn primary" data-i18n="save"></button>
                <button type="button" id="btn-skill-close" class="btn ghost" data-i18n="cancel"></button>
                <span class="spacer"></span>
                <button type="button" id="btn-skill-delete" class="btn danger hidden" data-i18n="delete"></button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- Notes -->
      <section id="view-memory" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_memory"></h1>
          <button id="btn-mem-new" class="btn primary sm" data-i18n="mem_new"></button>
        </header>
        <div class="chips">
          <button id="mem-tab-notes" class="chip active" data-i18n="mem_tab_notes"></button>
          <button id="mem-tab-cand" class="chip hidden" data-i18n="mem_tab_cand"></button>
        </div>
        <div id="mem-notes">
          <div class="toolbar">
            <input id="mem-q" class="inp" type="search" data-i18n-ph="mem_search_ph" aria-label="Search">
            <select id="mem-type" class="inp" aria-label="Type"></select>
            <input id="mem-project" class="inp" list="mem-proj-list" data-i18n-ph="mem_project_ph" aria-label="Project">
            <datalist id="mem-proj-list"></datalist>
          </div>
          <div class="grid-2 skills-layout">
            <div class="panel scroll" id="mem-list"></div>
            <div class="panel accent hidden" id="mem-editor">
              <h3 id="mem-editor-title"></h3>
              <form id="form-mem" autocomplete="off">
                <label for="mem-title" data-i18n="mem_f_title"></label>
                <input id="mem-title" class="inp" required maxlength="200">
                <div class="row-2">
                  <div>
                    <label for="mem-f-type" data-i18n="mem_f_type"></label>
                    <select id="mem-f-type" class="inp" required></select>
                  </div>
                  <div>
                    <label for="mem-f-project" data-i18n="mem_f_project"></label>
                    <input id="mem-f-project" class="inp" list="mem-proj-list" maxlength="80">
                  </div>
                </div>
                <div class="row-2">
                  <div>
                    <label for="mem-f-tags" data-i18n="mem_f_tags"></label>
                    <input id="mem-f-tags" class="inp">
                  </div>
                  <div>
                    <label for="mem-f-review" data-i18n="mem_f_review"></label>
                    <input id="mem-f-review" class="inp" type="date">
                  </div>
                </div>
                <label for="mem-body" data-i18n="mem_f_body"></label>
                <textarea id="mem-body" class="inp mono" rows="14" spellcheck="false"></textarea>
                <p id="mem-meta" class="dim small"></p>
                <div id="mem-conflict" class="notice hidden">
                  <span data-i18n="mem_conflict"></span>
                  <button type="button" id="btn-mem-reload" class="btn sm" data-i18n="mem_reload"></button>
                </div>
                <div class="btn-row">
                  <button class="btn primary" data-i18n="save"></button>
                  <button type="button" id="btn-mem-close" class="btn ghost" data-i18n="cancel"></button>
                  <span class="spacer"></span>
                  <button type="button" id="btn-mem-delete" class="btn danger hidden" data-i18n="delete"></button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div id="mem-cand" class="hidden">
          <div class="panel scroll" id="mem-cand-list"></div>
        </div>
      </section>

      <!-- Scheduled jobs -->
      <section id="view-cron" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_cron"></h1>
          <button id="btn-cron-new" class="btn primary sm" data-i18n="cron_new"></button>
        </header>
        <div class="panel">
          <p class="dim small" data-i18n="cron_hint"></p>
          <p id="cron-runner" class="small hidden" role="status"></p>
          <div class="tbl-scroll">
            <table class="tbl" id="cron-table">
              <thead><tr>
                <th data-i18n="cron_col_name"></th>
                <th data-i18n="cron_col_when"></th>
                <th data-i18n="cron_col_next"></th>
                <th data-i18n="cron_col_last"></th>
                <th data-i18n="cron_col_on"></th>
                <th data-admin data-i18n="cron_col_owner"></th>
                <th></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <p id="cron-empty" class="dim hidden" data-i18n="cron_empty"></p>
        </div>
        <div class="panel accent hidden" id="cron-editor">
          <h3 id="cron-editor-title"></h3>
          <form id="form-cron" autocomplete="off">
            <label for="cron-name" data-i18n="cron_f_name"></label>
            <input id="cron-name" class="inp" required maxlength="80">
            <label data-i18n="cron_f_when"></label>
            <div class="chips" id="cron-presets">
              <button type="button" class="chip" data-preset="daily" data-i18n="cron_p_daily"></button>
              <button type="button" class="chip" data-preset="weekdays" data-i18n="cron_p_weekdays"></button>
              <button type="button" class="chip" data-preset="weekly" data-i18n="cron_p_weekly"></button>
              <button type="button" class="chip" data-preset="hourly" data-i18n="cron_p_hourly"></button>
            </div>
            <div class="row-2">
              <div>
                <label for="cron-time" data-i18n="cron_f_time"></label>
                <input id="cron-time" class="inp" type="time" value="06:30">
              </div>
              <div>
                <label for="cron-dow" data-i18n="cron_f_dow"></label>
                <select id="cron-dow" class="inp" disabled></select>
              </div>
            </div>
            <label for="cron-expr" data-i18n="cron_f_expr"></label>
            <input id="cron-expr" class="inp mono" required spellcheck="false">
            <p id="cron-preview" class="dim small" aria-live="polite"></p>
            <label for="cron-prompt" data-i18n="cron_f_prompt"></label>
            <textarea id="cron-prompt" class="inp" rows="6" required></textarea>
            <div class="row-2">
              <div>
                <label for="cron-notify" data-i18n="cron_f_notify"></label>
                <input id="cron-notify" class="inp" value="user">
              </div>
              <div data-admin>
                <label for="cron-owner" data-i18n="cron_f_owner"></label>
                <input id="cron-owner" class="inp mono">
              </div>
            </div>
            <label class="check"><input id="cron-enabled" type="checkbox" checked> <span data-i18n="cron_f_enabled"></span></label>
            <div class="btn-row">
              <button class="btn primary" data-i18n="save"></button>
              <button type="button" id="btn-cron-close" class="btn ghost" data-i18n="cancel"></button>
              <span class="spacer"></span>
              <button type="button" id="btn-cron-delete" class="btn danger hidden" data-i18n="delete"></button>
            </div>
          </form>
        </div>
        <div class="panel" id="runner-panel" data-admin>
          <h3 data-i18n="rn_title"></h3>
          <p class="dim small" data-i18n="rn_hint"></p>
          <form id="form-runner" autocomplete="off">
            <label for="rn-backend" data-i18n="rn_f_backend"></label>
            <select id="rn-backend" class="inp"></select>
            <label for="rn-model" data-i18n="rn_f_model"></label>
            <input id="rn-model" class="inp mono" maxlength="200">
            <p id="rn-model-hint" class="dim small"></p>
            <label for="rn-key" data-i18n="rn_f_key"></label>
            <input id="rn-key" class="inp mono" type="password" autocomplete="new-password">
            <p id="rn-key-state" class="dim small" aria-live="polite"></p>
            <label class="check"><input id="rn-builtin" type="checkbox"> <span data-i18n="rn_f_builtin"></span></label>
            <p class="dim small" data-i18n="rn_builtin_hint"></p>
            <p id="rn-builtin-state" class="small" role="status"></p>
            <div class="btn-row">
              <button class="btn primary" data-i18n="save"></button>
            </div>
          </form>
        </div>
      </section>

      <!-- Playbooks -->
      <section id="view-playbooks" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_playbooks"></h1>
          <button id="btn-pb-start" class="btn primary sm" data-i18n="pb_start"></button>
        </header>
        <div class="chips">
          <button id="pb-tab-runs" class="chip active" data-i18n="pb_tab_runs"></button>
          <button id="pb-tab-lib" class="chip" data-i18n="pb_tab_lib"></button>
        </div>
        <div id="pb-runs">
          <div class="panel accent hidden" id="pb-start-form">
            <form id="form-pb-start" autocomplete="off">
              <div class="row-2">
                <div>
                  <label for="pb-f-playbook" data-i18n="pb_f_playbook"></label>
                  <select id="pb-f-playbook" class="inp" required></select>
                </div>
                <div>
                  <label for="pb-f-project" data-i18n="pb_f_project"></label>
                  <input id="pb-f-project" class="inp" required maxlength="80">
                </div>
              </div>
              <label for="pb-f-title" data-i18n="pb_f_title"></label>
              <input id="pb-f-title" class="inp" maxlength="120">
              <div class="btn-row">
                <button class="btn primary" data-i18n="pb_go"></button>
                <button type="button" id="btn-pb-start-close" class="btn ghost" data-i18n="cancel"></button>
              </div>
            </form>
          </div>
          <div class="toolbar">
            <input id="pb-project" class="inp" data-i18n-ph="pb_project_ph" aria-label="Project">
            <select id="pb-status" class="inp" aria-label="Status">
              <option value="active" data-i18n="pb_st_active"></option>
              <option value="done" data-i18n="pb_st_done"></option>
              <option value="cancelled" data-i18n="pb_st_cancelled"></option>
              <option value="all" data-i18n="pb_st_all"></option>
            </select>
          </div>
          <div class="grid-2 skills-layout">
            <div class="panel scroll" id="pb-run-list"></div>
            <div class="panel accent hidden" id="pb-run" aria-live="polite"></div>
          </div>
        </div>
        <div id="pb-lib" class="hidden">
          <div class="btn-row">
            <button id="btn-pb-example" class="btn primary sm hidden" data-i18n="pb_example"></button>
            <button id="btn-pb-new" class="btn ghost sm" data-i18n="pb_new"></button>
          </div>
          <div class="grid-2 skills-layout">
            <div class="panel scroll" id="pb-lib-list"></div>
            <div class="panel accent hidden" id="pb-def"></div>
          </div>
          <div class="panel accent hidden" id="pb-def-editor">
            <h3 id="pb-def-editor-title"></h3>
            <form id="form-pb-def" autocomplete="off">
              <div class="row-2">
                <div>
                  <label for="pbd-name" data-i18n="pb_f_name"></label>
                  <input id="pbd-name" class="inp" required maxlength="60">
                </div>
                <div>
                  <label for="pbd-category" data-i18n="pb_f_category"></label>
                  <input id="pbd-category" class="inp" maxlength="60">
                </div>
              </div>
              <label for="pbd-title" data-i18n="pb_f_title2"></label>
              <input id="pbd-title" class="inp" required maxlength="120">
              <label for="pbd-desc" data-i18n="pb_f_desc"></label>
              <input id="pbd-desc" class="inp" maxlength="600">
              <label for="pbd-source" data-i18n="pb_f_source"></label>
              <input id="pbd-source" class="inp" type="url" maxlength="300">
              <h4 data-i18n="pb_stages"></h4>
              <div id="pb-stage-forms"></div>
              <button type="button" id="btn-pb-add-stage" class="btn ghost sm" data-i18n="pb_add_stage"></button>
              <label for="pbd-plays" data-i18n="pb_f_plays"></label>
              <textarea id="pbd-plays" class="inp mono" rows="5" spellcheck="false"></textarea>
              <label for="pbd-guidance" data-i18n="pb_f_guidance"></label>
              <textarea id="pbd-guidance" class="inp" rows="8"></textarea>
              <div class="btn-row">
                <button class="btn primary" data-i18n="save"></button>
                <button type="button" id="btn-pb-def-close" class="btn ghost" data-i18n="cancel"></button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- Users -->
      <section id="view-users" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_users"></h1>
          <span id="us-enforce" class="badge"></span>
        </header>
        <div class="grid-2">
          <div class="panel">
            <h3 data-i18n="us_list_title"></h3>
            <p class="dim small" data-i18n="us_list_hint"></p>
            <table class="tbl" id="us-table">
              <thead><tr>
                <th data-i18n="us_col_identity"></th>
                <th data-i18n="us_col_role"></th>
                <th data-i18n="us_col_area"></th><th></th>
              </tr></thead>
              <tbody></tbody>
            </table>
            <p id="us-empty" class="dim hidden" data-i18n="us_empty"></p>
          </div>
          <div class="panel accent">
            <h3 id="us-editor-title" data-i18n="us_add_title"></h3>
            <form id="form-user" autocomplete="off">
              <label data-i18n="us_f_identity"></label>
              <input id="us-identity" class="inp mono" required data-i18n-ph="us_ph_identity">
              <div class="row-2">
                <div>
                  <label data-i18n="us_f_role"></label>
                  <select id="us-role" class="inp">
                    <option value="default" data-i18n="us_role_default"></option>
                    <option value="admin">admin</option>
                    <option value="user">user</option>
                    <option value="viewer">viewer</option>
                  </select>
                </div>
                <div>
                  <label data-i18n="us_f_memory"></label>
                  <select id="us-memory" class="inp">
                    <option value="">—</option>
                    <option value="own" data-i18n="us_own"></option>
                    <option value="all" data-i18n="us_all"></option>
                  </select>
                </div>
              </div>
              <div class="row-2">
                <div>
                  <label data-i18n="us_f_services"></label>
                  <input id="us-services" class="inp mono" data-i18n-ph="us_ph_access">
                </div>
                <div>
                  <label data-i18n="us_f_skills"></label>
                  <input id="us-skills" class="inp mono" data-i18n-ph="us_ph_access">
                </div>
              </div>
              <label data-i18n="us_f_devices"></label>
              <input id="us-devices" class="inp mono" data-i18n-ph="us_ph_devices">
              <label data-i18n="us_f_note"></label>
              <input id="us-note" class="inp">
              <div class="btn-row">
                <button class="btn primary" data-i18n="save"></button>
                <button type="button" id="btn-user-clear" class="btn ghost" data-i18n="clear"></button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- Services & devices (read-only) -->
      <section id="view-services" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_services"></h1>
          <button id="btn-sv-new" class="btn primary sm" data-i18n="sv_new"></button>
        </header>
        <div class="chips" id="sv-kinds"></div>
        <div class="panel">
          <p class="dim small" data-i18n="sv_hint"></p>
          <div class="tbl-scroll">
          <table class="tbl" id="sv-table">
            <thead><tr>
              <th data-i18n="sv_col_kind"></th>
              <th data-i18n="sv_col_name"></th>
              <th data-i18n="sv_col_target"></th>
              <th data-i18n="sv_col_secret"></th>
              <th data-i18n="sv_col_desc"></th>
              <th></th>
            </tr></thead>
            <tbody></tbody>
          </table>
          </div>
          <p id="sv-empty" class="dim hidden" data-i18n="sv_empty"></p>
        </div>
        <div class="panel accent hidden" id="sv-editor">
          <h3 id="sv-editor-title"></h3>
          <p id="sv-help" class="dim small"></p>
          <form id="form-sv" autocomplete="off">
            <label for="sv-kind" data-i18n="sv_f_kind"></label>
            <select id="sv-kind" class="inp"></select>
            <div id="sv-fields" class="form-fields"></div>
            <div class="btn-row">
              <button class="btn primary" data-i18n="save"></button>
              <button type="button" id="btn-sv-close" class="btn ghost" data-i18n="cancel"></button>
              <span class="spacer"></span>
              <button type="button" id="btn-sv-delete" class="btn danger hidden" data-i18n="delete"></button>
            </div>
          </form>
        </div>
      </section>

      <!-- Audit log -->
      <section id="view-logs" class="view hidden">
        <header class="view-head">
          <h1 data-i18n="nav_logs"></h1>
          <span class="badge" data-i18n="lg_badge"></span>
        </header>
        <div class="panel">
          <p class="dim small" data-i18n="lg_hint"></p>
          <div class="log-bar">
            <input id="lg-filter" class="inp mono" data-i18n-ph="lg_filter_ph">
            <button id="lg-refresh" class="btn ghost sm" data-i18n="lg_refresh"></button>
          </div>
          <table class="tbl" id="lg-table">
            <thead><tr>
              <th data-i18n="lg_col_time"></th>
              <th data-i18n="lg_col_identity"></th>
              <th data-i18n="lg_col_tool"></th>
              <th data-i18n="lg_col_decision"></th>
              <th data-i18n="lg_col_reason"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
          <p id="lg-empty" class="dim hidden" data-i18n="lg_empty"></p>
        </div>
      </section>
    </main>
  </div>

  <!-- confirm modal + toast -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card panel">
      <p id="modal-text"></p>
      <div class="btn-row">
        <button id="modal-ok" class="btn danger" data-i18n="confirm"></button>
        <button id="modal-cancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
